apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.lumvibe.videobaker'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace "com.lumvibe.videobaker"
  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 36
    // ADDED: wires the new C++ engine (src/main/cpp/) into the existing
    // Gradle build. Nothing above this line changed.
    externalNativeBuild {
      cmake {
        cppFlags ""
      }
    }
  }
  compileSdk 36
  // ADDED: same reasoning as defaultConfig's block above — points Gradle
  // at the new CMakeLists.txt.
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
    }
  }
}

dependencies {
  // Intentionally no FFmpeg / third-party media dependency.
  // Everything here is android.media.* and android.opengl.* (built into the OS, free).
  implementation 'com.google.mediapipe:tasks-vision:0.10.26' 
}